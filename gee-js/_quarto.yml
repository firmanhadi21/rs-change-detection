project:
  type: website
  # Rendered site goes into docs/, which the Pages workflow publishes whole,
  # so this lands at <site>/gee-js/. Source stays here in gee-js/.
  output-dir: ../docs/gee-js
  resources:
    - scripts/
    - parent.css
    # Figures for the Day 1 fundamentals section. Generated by
    # make_figures.py, committed as SVG so the deck needs no build step and
    # stays legible at projector resolution.
    - img/

website:
  title: "Workshop GEE JavaScript"
  description: >
    Webinar dua hari untuk pemula: hari pertama konsep, hari kedua praktik.
    Sentinel-2, NDVI, klasifikasi tutupan lahan, deteksi perubahan, dan
    ekspor peta untuk laporan.
  site-url: https://firmanhadi21.github.io/rs-change-detection/gee-js/

  # NO navbar and NO Quarto sidebar. The navigation on these pages is the
  # PARENT tutorial's own <nav class="side">, injected below -- so the reader
  # stays inside the same furniture instead of meeting a second, similar-looking
  # one. Regenerate the injected markup with: python3 gee-js/build_shell.py

format:
  html:
    # parent.css is docs/index.html's stylesheet verbatim, so tokens and layout
    # cannot drift from the tutorial's. theme.scss adds nothing structural now
    # and is kept only for Quarto's own components.
    theme:
      - cosmo
      - theme.scss
    css:
      - parent.css
      - styles.css
    # Wrap every page in the parent's grid: sidebar on the left, content in
    # <main>. Generated from docs/index.html rather than hand-copied, so the
    # tutorial's nav and these pages cannot fall out of step.
    include-before-body: _shell-open.html
    include-after-body: _shell-close.html
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "Di halaman ini"
    number-sections: false
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    lang: id
    fig-align: center
    link-external-newwindow: true

# Narasi Bahasa Indonesia; judul bagian dan komentar kode Bahasa Inggris, agar
# peserta mengenali istilah yang sama saat membuka dokumentasi Earth Engine.
lang: id
