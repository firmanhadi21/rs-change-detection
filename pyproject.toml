[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earthchange"
version = "0.1.81"
description = "Multipurpose satellite environmental monitoring and change detection: fire danger, smoke exposure, drought, heat, flood and land change, via Google Earth Engine or Microsoft Planetary Computer."
readme = "PYPI_README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Firman Hadi", email = "firmanhadi21@lecturer.undip.ac.id" }]
maintainers = [{ name = "Firman Hadi", email = "firmanhadi21@lecturer.undip.ac.id" }]
keywords = [
  "remote-sensing", "change-detection", "sentinel", "landsat",
  "earth-engine", "planetary-computer", "ndvi", "ndbi", "flood",
  "deforestation", "gis", "geospatial",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = ["requests"]

[project.optional-dependencies]
# GEE backend (needs a free Earth Engine account)
gee = ["earthengine-api"]
# Planetary Computer backend (no account needed)
mpc = ["numpy", "rasterio", "pystac-client", "planetary-computer", "odc-stac", "rioxarray"]
# Value-added map rendering
maps = ["numpy", "rasterio", "matplotlib", "contextily", "scipy", "scikit-image", "shapely"]
# Transit accessibility (SDG 11.2.1): OSM walking network + WorldPop
transit = ["earthengine-api", "networkx", "scipy", "shapely", "numpy", "rasterio", "matplotlib", "contextily"]
# True GPU 3D spike render for population-change (Miloš Popović's Rust/WebGPU lib)
forge3d = ["forge3d", "numpy", "rasterio", "pillow"]
# Zonal breakdowns against a polygon layer (fire-danger --zones)
zones = ["geopandas", "pyogrio", "numpy", "rasterio", "shapely"]
# Wildfire smoke map video (smoke-video). Also needs ffmpeg on PATH, and a
# Vulkan device — a GPU, or mesa-vulkan-drivers for headless llvmpipe.
video = ["forge3d>=1.34", "numpy", "scipy", "pandas", "pillow", "requests"]
# Indicative smoke trajectories (smoke-track): air parcels on ERA5 100 m wind
track = ["earthengine-api", "movingpandas", "geopandas", "pyogrio", "numpy",
         "rasterio", "matplotlib", "contextily", "shapely"]
# Test suite. Runs offline with `pytest -m "not network"`.
dev = ["pytest"]
# Everything
all = [
  "earthengine-api", "numpy", "rasterio", "pystac-client",
  "planetary-computer", "odc-stac", "rioxarray", "matplotlib", "contextily",
  "geopandas", "pyogrio", "movingpandas",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: reaches a public endpoint (ARL S3). Skip with -m 'not network'",
]

[project.urls]
Homepage = "https://github.com/firmanhadi21/rs-change-detection"
Documentation = "https://firmanhadi21.github.io/rs-change-detection/"
Repository = "https://github.com/firmanhadi21/rs-change-detection"

[project.scripts]
earthchange = "earthchange.detect:main"
earthmap = "earthchange.make_map:main"
earthbrief = "earthchange.brief:main"
earthchain = "earthchange.chain:main"

[tool.hatch.build.targets.wheel]
packages = ["earthchange"]

[tool.hatch.build.targets.sdist]
include = ["earthchange", "PYPI_README.md", "README.md", "LICENSE", "PUBLISHING.md"]
