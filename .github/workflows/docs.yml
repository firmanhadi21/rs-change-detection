name: Deploy docs (tutorial + API + book) to Pages

on:
  push:
    branches: [main]
    paths:
      - "earthchange/**"
      - "docs/**"
      - "buku/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install earthchange + pdoc
        # [maps] pulls the deps needed to import every module for introspection
        # (numpy, rasterio, matplotlib, contextily); ee/odc/pystac are lazy.
        run: |
          python -m pip install --upgrade pip
          pip install ".[maps]" pdoc

      - name: Generate API reference
        # The ALOS-2 InSAR modules raise at import without insardev_pygmtsar,
        # which is not on PyPI, so they are left out of the reference.
        run: pdoc earthchange '!earthchange.alos2_mission' '!earthchange.alos2_transform' -o docs/api

      - name: Set up Quarto (with TinyTeX for the PDF)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # The book's Python cells are NOT executed here: buku/_freeze/ holds
      # their computed outputs, committed after a local render with Earth
      # Engine access. Output goes to docs/buku/ (HTML + linked PDF).
      - name: Render the book (buku/ -> docs/buku/)
        run: quarto render buku

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact (whole docs/ = tutorial + api + book)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
